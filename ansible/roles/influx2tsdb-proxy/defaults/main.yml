---
# influx2tsdb-proxy Ansible role 默认配置

# GitHub Release 版本
influx2tsdb_proxy_version: "v1.0.1"

# 二进制文件下载 URL
# 注意：GitHub Release URL 格式为 /releases/download/<tag>/<filename>
influx2tsdb_proxy_binary_url: "https://github.com/mars-base/influx2tsdb-proxy/releases/download/{{ influx2tsdb_proxy_version }}/influx2tsdb-proxy-linux-amd64"

# 安装目录（默认不设置，由 task 自动计算为 /opt/influx2tsdb-proxy-<instance_name>）
# influx2tsdb_proxy_dir: "/opt/influx2tsdb-proxy"

# 监听端口（默认不设置，由 task 自动计算为 8086 + index）
# influx2tsdb_proxy_port: 8086

# 连接池大小
influx2tsdb_proxy_pool_size: 10

# 是否启用 verbose 模式
influx2tsdb_proxy_verbose: false

# Supervisor 配置
influx2tsdb_proxy_supervisor_autorestart: true
influx2tsdb_proxy_supervisor_autostart: true
influx2tsdb_proxy_supervisor_user: root
influx2tsdb_proxy_supervisor_startsecs: 3
influx2tsdb_proxy_supervisor_startretries: 3

# 实例列表（支持单机多实例）
influx2tsdb_proxy_instances:
  - name: default
    pg_dsn: "postgres://user:pass@localhost:5432/tsdb?sslmode=disable"
    # influx_db: game_monitor                 # 可选，InfluxDB 对外数据库名，不设置则使用 name
    # dir: /opt/influx2tsdb-proxy-default  # 可选，不设置则自动计算
    # port: 8086                            # 可选，不设置则自动计算
    # pool_size: 20                         # 可选，覆盖默认值
    # verbose: true                         # 可选，覆盖默认值
